<!-- index.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Period and Mood Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/persian-datepicker/1.0.0/css/persian-datepicker.min.css">
    <style>
        body {
            background-color: #F5F7FA;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 400px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .tab {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .tab button {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
        }
        .active {
            color: #0047AB;
            font-weight: bold;
        }
        .mood-buttons, .symptom-buttons {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .mood-buttons button, .symptom-buttons button {
            border: 2px solid #0047AB;
            border-radius: 28px;
            background: white;
            padding: 10px;
            cursor: pointer;
        }
        .mood-buttons button.selected {
            background: #0047AB;
            color: white;
        }
        .primary-button {
            background: #0047AB;
            color: white;
            border: none;
            border-radius: 28px;
            padding: 10px;
            cursor: pointer;
            width: 100%;
        }
        .success-message {
            display: none;
            color: green;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tab">
            <button class="active" onclick="showTab('mood')">حالت</button>
            <button onclick="showTab('symptoms')">علائم</button>
            <button onclick="showTab('cycle')">چرخه</button>
        </div>
        <div id="mood" class="tab-content">
            <div class="mood-buttons">
                <button onclick="selectMood('good')">🙂 خوبم</button>
                <button onclick="selectMood('tired')">😐 خسته</button>
                <button onclick="selectMood('sensitive')">😔 حساس</button>
                <button onclick="selectMood('nervous')">😠 عصبی</button>
            </div>
        </div>
        <div id="symptoms" class="tab-content" style="display:none;">
            <div class="symptom-buttons">
                <button onclick="toggleSymptom('fatigue')">😴 خستگی</button>
                <button onclick="toggleSymptom('pain')">🔥 درد</button>
                <button onclick="toggleSymptom('headache')">🤕 سردرد</button>
                <button onclick="toggleSymptom('craving')">🍫 هوس</button>
            </div>
        </div>
        <div id="cycle" class="tab-content" style="display:none;">
            <input type="text" id="lastPeriod" class="persian-datepicker" placeholder="تاریخ آخرین قاعدگی">
        </div>
        <button class="primary-button" onclick="saveData()">ثبت اطلاعات</button>
        <div class="success-message" id="successMessage">ثبت شد غزلیلییی ممرییی ✅</div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jalaali-js/1.0.0/jalaali.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/persian-datepicker/1.0.0/js/persian-datepicker.min.js"></script>
    <script>
        let selectedMood = '';
        let selectedSymptoms = [];

        $(document).ready(function() {
            $('.persian-datepicker').persianDatepicker();
        });

        function showTab(tab) {
            $('.tab-content').hide();
            $('#' + tab).show();
            $('.tab button').removeClass('active');
            $('.tab button:contains(' + tab + ')').addClass('active');
        }

        function selectMood(mood) {
            selectedMood = mood;
            $('.mood-buttons button').removeClass('selected');
            $('.mood-buttons button:contains(' + mood + ')').addClass('selected');
        }

        function toggleSymptom(symptom) {
            if (selectedSymptoms.includes(symptom)) {
                selectedSymptoms = selectedSymptoms.filter(s => s !== symptom);
            } else {
                selectedSymptoms.push(symptom);
            }
        }

        function saveData() {
            const lastPeriodDate = $('#lastPeriod').val();
            const nextPeriodDate = new Date(new Date(lastPeriodDate).getTime() + 28 * 24 * 60 * 60 * 1000);
            localStorage.setItem('mood', selectedMood);
            localStorage.setItem('symptoms', JSON.stringify(selectedSymptoms));
            localStorage.setItem('nextPeriod', nextPeriodDate.toLocaleDateString('fa-IR'));
            $('#successMessage').fadeIn().delay(3000).fadeOut();
        }
    </script>
</body>
</html>
