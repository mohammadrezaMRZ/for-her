<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غزلیلی 💙</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="card">
  <h1>غزلیلی 💙</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('moodSection', this)">حالت</button>
    <button class="tab-btn" onclick="showTab('symptomSection', this)">علائم</button>
    <button class="tab-btn" onclick="showTab('cycleSection', this)">چرخه</button>
  </div>

  <div id="moodSection" class="section" style="display:block;">
    <div class="moods">
      <button onclick="saveMood(1)">😴</button>
      <button onclick="saveMood(2)">😔</button>
      <button onclick="saveMood(3)">😐</button>
      <button onclick="saveMood(4)">🙂</button>
      <button onclick="saveMood(5)">✨</button>
    </div>
  </div>

  <div id="symptomSection" class="section">
    <div class="moods">
      <button onclick="toggleSymptom(this,'خستگی')">😴 خستگی</button>
      <button onclick="toggleSymptom(this,'درد')">🔥 درد</button>
      <button onclick="toggleSymptom(this,'سردرد')">🤕 سردرد</button>
      <button onclick="toggleSymptom(this,'هوس')">🍫 هوس</button>
    </div>
  </div>

  <div id="cycleSection" class="section">
    <input type="date" id="cycleDate" placeholder="انتخاب تاریخ آخرین پریود">
  </div>

  <div id="message" class="message">امروز حالت رو بگو 🤍</div>
  <button class="save" onclick="confirmSave()">ثبت اطلاعات</button>

  <div id="chartContainer" style="margin-top:20px;">
    <canvas id="moodChart"></canvas>
  </div>
</div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
