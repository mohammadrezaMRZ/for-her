<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت وضعیت روزانه</title>
    <script src="https://cdn.jsdelivr.net/gh/jalaali/jalaali-js@1.1.3/dist/jalaali.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-date.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        
        :root {
            --primary-blue: #0047AB; /* آبی کاربنی */
            --bg-light: #f5f7fa;
            --white: #ffffff;
            --text-dark: #1A202C;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-light);
            margin: 0; padding: 20px; display: flex; justify-content: center;
        }

        .container {
            max-width: 420px; width: 100%; background: var(--white);
            border-radius: 24px; padding: 25px; box-shadow: 0 10px 25px rgba(0, 71, 171, 0.08);
        }

        h1 { color: var(--primary-blue); text-align: center; font-size: 22px; }

        /* Tabs */
        .tabs { display: flex; background: #edf2f7; border-radius: 16px; padding: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 12px; cursor: pointer; background: transparent; color: #718096; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: var(--primary-blue); color: white; }

        .section { display: none; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Buttons Grid */
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .option { 
            padding: 15px 10px; border: 2px solid var(--border); border-radius: 14px; 
            background: white; color: var(--text-dark); cursor: pointer; font-family: inherit;
            transition: 0.2s; font-weight: 500;
        }
        .option.active { border-color: var(--primary-blue); background: #f0f7ff; color: var(--primary-blue); }

        input[type="text"] {
            width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px;
            margin-top: 10px; box-sizing: border-box; text-align: center;
        }

        .primary-btn {
            width: 100%; background: var(--primary-blue); color: white; border: none;
            padding: 15px; border-radius: 14px; font-weight: bold; margin-top: 20px; cursor: pointer;
        }
        
        #cycleBar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: #eee; margin-top: 15px; }
        .day-block { flex: 1; border-right: 1px solid #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>امروز چطوری؟</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('moodSection', this)">حالت</button>
        <button class="tab-btn" onclick="showTab('needSection', this)">نیاز</button>
        <button class="tab-btn" onclick="showTab('cycleSection', this)">چرخه</button>
    </div>

    <div id="moodSection" class="section" style="display:block;">
        <div class="grid-options" id="moodOptions">
            <button class="option" onclick="selectSingle(this, 'mood', 'خوب')">🙂 خوبم</button>
            <button class="option" onclick="selectSingle(this, 'mood', 'خسته')">😐 خسته</button>
            <button class="option" onclick="selectSingle(this, 'mood', 'حساس')">😔 حساس</button>
            <button class="option" onclick="selectSingle(this, 'mood', 'عصبی')">😠 عصبی</button>
        </div>
    </div>

    <div id="needSection" class="section">
        <div class="grid-options" id="needOptions">
            <button class="option" onclick="selectSingle(this, 'need', 'بغل')">🫂 بغل</button>
            <button class="option" onclick="selectSingle(this, 'need', 'گوش بده')">🤍 حرف زدن</button>
            <button class="option" onclick="selectSingle(this, 'need', 'سکوت')">😶 سکوت</button>
            <button class="option" onclick="selectSingle(this, 'need', 'تنهایی')">🕊️ تنهایی</button>
        </div>
    </div>

    <div id="cycleSection" class="section">
        <label style="font-size: 14px; color: #718096;">تاریخ آخرین شروع قاعدگی:</label>
        <input type="text" id="datepicker" placeholder="انتخاب تاریخ">
        <button class="primary-btn" onclick="savePeriod()">ثبت و محاسبه</button>
        <div id="cycleBar"></div>
        <p id="nextPredict" style="font-size: 13px; text-align: center; color: #4a5568; margin-top: 10px;"></p>
    </div>
</div>

<script>
    function showTab(id, btn) {
        document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).style.display = 'block';
        btn.classList.add('active');
    }

    function selectSingle(btn, key, value) {
        const parent = btn.parentElement;
        parent.querySelectorAll('.option').forEach(opt => opt.classList.remove('active'));
        btn.classList.add('active');
        localStorage.setItem(key, value);
    }

    $(document).ready(function() {
        $("#datepicker").persianDatepicker({ format: 'YYYY/MM/DD', autoClose: true });
    });

    function savePeriod() {
        let shDate = document.getElementById('datepicker').value;
        if(!shDate) return;
        let [jy,jm,jd] = shDate.split('/').map(Number);
        let g = jalaali.toGregorian(jy,jm,jd);
        let lastDate = new Date(g.gy, g.gm-1, g.gd);
        
        localStorage.setItem('lastPeriod', lastDate.toISOString().split('T')[0]);
        
        // محاسبه پیش‌فرض ۲۸ روزه
        let nextP = new Date(lastDate.getTime() + 28*24*60*60*1000);
        localStorage.setItem('nextPeriod', nextP.toISOString().split('T')[0]);
        alert("اطلاعات ذخیره شد.");
    }
</script>
</body>
</html>
