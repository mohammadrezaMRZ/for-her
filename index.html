<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روزت چطور بود؟</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap');

body {
  font-family: 'Vazirmatn', sans-serif;
  background: #ffffff;
  margin: 0;
  color: #0B3D91;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  max-width: 440px;
  width: 100%;
  background: #e6f0ff; /* آبی روشن */
  border-radius: 16px;
  padding: 20px 20px 40px 20px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.1);
}

h1 {
  font-size: 24px;
  color: #0B3D91;
  margin-bottom: 12px;
  text-align: center;
}

p { font-size:16px; margin:6px 0; }

button {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  font-size: 16px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition:0.2s;
}

button.primary { background:#0B3D91; color:#fff; }
button.option { background:#cce0ff; color:#0B3D91; }

input[type=date] {
  padding:10px;
  font-size:16px;
  border-radius:12px;
  border:1px solid #0B3D91;
  margin:10px 0;
  width:100%;
}

label { font-weight:600; margin-top:10px; display:block; }

.section { margin-bottom:20px; padding:10px; background:#fff; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.05); }

.section h2 { font-size:20px; margin-bottom:10px; color:#0B3D91; }

.mood-btns, .symptom-btns { display:flex; flex-wrap:wrap; gap:8px; }

.symptom-btns button, .mood-btns button { flex:1 1 45%; }

#cycleBar {
  display:flex;
  justify-content:space-between;
  margin: 12px 0;
  height: 20px;
  border-radius: 10px;
  overflow:hidden;
  background:#fff;
  border:1px solid #0B3D91;
}

.day-block { flex:1; }

</style>
</head>
<body>
<div class="container">

  <!-- بخش ثبت احساس -->
  <div class="section" id="moodSection">
    <h2>حالت امروز</h2>
    <div class="mood-btns">
      <button onclick="setMood('خوب')">🙂 خوبم</button>
      <button onclick="setMood('خسته')">😐 خسته</button>
      <button onclick="setMood('حساس')">😔 حساس</button>
    </div>
    <p id="moodDisplay">حالت فعلی: -</p>
  </div>

  <!-- بخش نیاز امروز -->
  <div class="section" id="needSection">
    <h2>نیاز امروز</h2>
    <div class="mood-btns">
      <button onclick="setNeed('بغل')">🫂 بغلم کنی</button>
      <button onclick="setNeed('گوش بده')">🤍 فقط گوش بدی</button>
      <button onclick="setNeed('حرف نزنیم')">😶 حرف نزنیم</button>
      <button onclick="setNeed('حواسمو پرت کن')">😄 حواسمو پرت کنی</button>
      <button onclick="setNeed('تنهایی')">🕊️ تنها باشم</button>
    </div>
    <p id="needDisplay">نیاز فعلی: -</p>
  </div>

  <!-- بخش ثبت آخرین پریود -->
  <div class="section" id="periodSection">
    <h2>آخرین پریود</h2>
    <label>تاریخ اولین روز پریود اخیرت (اختیاری)</label>
    <input type="date" id="lastPeriod">
    <button class="primary" onclick="savePeriod()">ثبت/ویرایش</button>
    <p id="nextPeriodDisplay">پریود بعدی: -</p>
    <p id="nextPMSDisplay">PMS بعدی: -</p>
  </div>

  <!-- بخش ثبت علائم -->
  <div class="section" id="symptomSection">
    <h2>علائم امروز</h2>
    <div class="symptom-btns">
      <button onclick="toggleSymptom('خستگی')">😴 خستگی</button>
      <button onclick="toggleSymptom('درد')">🔥 درد</button>
      <button onclick="toggleSymptom('خلق و خو')">💭 خلق و خو</button>
      <button onclick="toggleSymptom('هوس غذایی')">🍫 هوس غذایی</button>
      <button onclick="toggleSymptom('سردرد')">🤕 سردرد</button>
    </div>
    <p id="symptomDisplay">علائم فعلی: -</p>
  </div>

  <!-- بخش چرخه ماه -->
  <div class="section" id="cycleSection">
    <h2>چرخه ماه</h2>
    <div id="cycleBar"></div>
  </div>

</div>

<script>
let symptoms = JSON.parse(localStorage.getItem('symptoms')||'[]');

// ثبت حالت
function setMood(mood){
  localStorage.setItem('mood', mood);
  updateDisplay();
}

// ثبت نیاز
function setNeed(need){
  localStorage.setItem('need', need);
  updateDisplay();
}

// ثبت/ویرایش پریود
function savePeriod(){
  const last = document.getElementById('lastPeriod').value;
  if(last){
    localStorage.setItem('lastPeriod', last);

    // تاریخ‌ها در تاریخچه
    let history = JSON.parse(localStorage.getItem('periodHistory')||'[]');
    if(!history.includes(last)) history.push(last);
    localStorage.setItem('periodHistory', JSON.stringify(history));

    const cycleLength = history.length>1? averageCycle(history) : 28;
    const pmsLength = 5;

    const lastDate = new Date(last);
    const nextPeriod = new Date(lastDate.getTime() + cycleLength*24*60*60*1000);
    const nextPMSStart = new Date(nextPeriod.getTime() - pmsLength*24*60*60*1000);

    localStorage.setItem('nextPeriod', nextPeriod.toISOString().split('T')[0]);
    localStorage.setItem('nextPMS', nextPMSStart.toISOString().split('T')[0]);
  }
  updateDisplay();
}

// ثبت/تغییر علائم
function toggleSymptom(sym){
  if(symptoms.includes(sym)) symptoms = symptoms.filter(s=>s!==sym);
  else symptoms.push(sym);
  localStorage.setItem('symptoms', JSON.stringify(symptoms));
  updateDisplay();
}

// میانگین طول چرخه
function averageCycle(history){
  let total=0;
  for(let i=1;i<history.length;i++){
    let d1=new Date(history[i-1]);
    let d2=new Date(history[i]);
    total += (d2-d1)/(1000*60*60*24);
  }
  return Math.round(total/(history.length-1));
}

// بروزرسانی تمام نمایش‌ها
function updateDisplay(){
  document.getElementById('moodDisplay').textContent = `حالت فعلی: ${localStorage.getItem('mood')||'-'}`;
  document.getElementById('needDisplay').textContent = `نیاز فعلی: ${localStorage.getItem('need')||'-'}`;
  document.getElementById('symptomDisplay').textContent = `علائم فعلی: ${(JSON.parse(localStorage.getItem('symptoms'))||[]).join(', ')||'-'}`;
  document.getElementById('nextPeriodDisplay').textContent = `پریود بعدی: ${localStorage.getItem('nextPeriod')||'-'}`;
  document.getElementById('nextPMSDisplay').textContent = `PMS بعدی: ${localStorage.getItem('nextPMS')||'-'}`;
  drawCycle();
}

// رسم چرخه ۳۰ روزه
function drawCycle(){
  const bar = document.getElementById('cycleBar');
  bar.innerHTML='';
  const today = new Date();
  const nextPeriod = localStorage.getItem('nextPeriod')? new Date(localStorage.getItem('nextPeriod')) : null;
  const nextPMS = localStorage.getItem('nextPMS')? new Date(localStorage.getItem('nextPMS')) : null;

  for(let i=0;i<30;i++){
    const day = new Date();
    day.setDate(today.getDate()+i);
    const div = document.createElement('div');
    div.classList.add('day-block');

    if(nextPMS && nextPeriod && day>=nextPMS && day<nextPeriod) div.style.background='#ffc0cb'; // PMS صورتی
    else if(nextPeriod && day.toDateString()===nextPeriod.toDateString()) div.style.background='#0B3D91'; // پریود آبی کاربنی
    else div.style.background='#cce0ff'; // روز عادی آبی روشن

    bar.appendChild(div);
  }
}

// بارگذاری اولیه
window.addEventListener('load', updateDisplay);
</script>
</body>
</html>
