<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وضعیت امروز</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap');

body {
  font-family: 'Vazirmatn', sans-serif;
  background: #ffffff;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: #0B3D91;
}

.container {
  max-width: 400px;
  width: 90%;
  background: #e6f0ff; /* آبی روشن */
  padding: 30px 20px;
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  text-align: center;
}

h1 {
  font-size: 24px;
  color: #0B3D91;
  margin-bottom: 20px;
}

p {
  font-size: 17px;
  line-height: 1.7;
  margin: 8px 0;
}
</style>
</head>
<body>
<div class="container">
  <h1>وضعیت امروز</h1>
  <p id="moodDisplay">حالت: -</p>
  <p id="needDisplay">نیاز امروز: -</p>
  <p id="nextPeriodDisplay">پریود بعدی: -</p>
  <p id="nextPMSDisplay">PMS بعدی: -</p>
</div>

<script>
document.getElementById('moodDisplay').textContent = `حالت: ${localStorage.getItem('mood')||'-'}`;
document.getElementById('needDisplay').textContent = `نیاز امروز: ${localStorage.getItem('need')||'-'}`;
document.getElementById('nextPeriodDisplay').textContent = `پریود بعدی: ${localStorage.getItem('nextPeriod')||'-'}`;
document.getElementById('nextPMSDisplay').textContent = `PMS بعدی: ${localStorage.getItem('nextPMS')||'-'}`;
</script>

</body>
</html>
