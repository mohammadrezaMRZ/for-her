<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وضعیت امروز</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap');

body {
  font-family: 'Vazirmatn', sans-serif;
  background: #fdf6f0;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: #333;
}

.container {
  max-width: 400px;
  width: 90%;
  background: #fff8f2;
  padding: 30px 20px;
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  text-align: center;
}

h1 {
  font-size: 24px;
  color: #6a4a3c;
  margin-bottom: 20px;
}

p {
  font-size: 17px;
  line-height: 1.7;
  color: #4a3d3c;
  margin: 8px 0;
}
</style>
</head>
<body>
<div class="container">
  <h1>وضعیت امروز</h1>
  <p id="mood">-</p>
  <p id="need">-</p>
</div>

<script>
const mood = localStorage.getItem('mood') || '-';
const need = localStorage.getItem('need') || '-';

document.getElementById('mood').textContent = `حالت: ${mood}`;
document.getElementById('need').textContent = `نیاز امروز: ${need}`;
</script>
</body>
</html>
