<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وضعیت غزلیلی</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="card">
  <h1>خلاصه وضعیت غزلیلی 🌸</h1>

  <div class="row">
    <span class="label">حالت:</span>
    <span class="value" id="m-out">-</span>
  </div>

  <div class="row" style="flex-direction:column;align-items:flex-end;">
    <span class="label">علائم:</span>
    <div id="s-out" style="margin-top:5px;"></div>
  </div>

  <div class="cycle">
    <div>موعد بعدی (تقریبی):</div>
    <strong id="p-out">ثبت نشده</strong>
  </div>

  <div style="margin-top:20px;">
    <canvas id="moodChartStatus"></canvas>
  </div>
</div>

<script>
function refreshStatus(){
  const mood = localStorage.getItem("savedMood") || "ثبت نشده";
  document.getElementById("m-out").textContent = mood;

  const syms = JSON.parse(localStorage.getItem("savedSymptoms")||"[]");
  document.getElementById("s-out").innerHTML = syms.length>0 ? syms.map(s=>`<span class="badge">${s}</span>`).join('') : "---";

  document.getElementById("p-out").textContent = localStorage.getItem("savedNextPeriod")||"نامشخص";

  // نمودار ماهانه
  const data = JSON.parse(localStorage.getItem("moods")||"[]");
  const labels = data.map(d=>d.date);
  const moods = data.map(d=>d.mood);

  const ctx = document.getElementById("moodChartStatus").getContext("2d");
  if(window.chartStatus) window.chartStatus.destroy();
  window.chartStatus = new Chart(ctx,{
    type:'line',
    data:{
      labels:labels,
      datasets:[{
        label:'احساس ماهانه',
        data:moods,
        borderColor:'#0B3D91',
        tension:0.3,
        fill:false
      }]
    },
    options:{
      responsive:true,
      scales:{ y:{min:1,max:5,ticks:{stepSize:1}} }
    }
  });
}

window.addEventListener("load",refreshStatus);
setInterval(refreshStatus,1000);
</script>
</body>
</html>
