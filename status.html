<!-- status.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Dashboard</title>
    <style>
        body {
            background-color: #F5F7FA;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 400px;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #0047AB;
            color: white;
            border-radius: 12px;
            padding: 5px 10px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Current Mood: <span id="currentMood"></span></h2>
        <div id="selectedSymptoms"></div>
        <h3>Next Period: <span id="nextPeriod"></span></h3>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function updateDashboard() {
            const mood = localStorage.getItem('mood');
            const symptoms = JSON.parse(localStorage.getItem('symptoms')) || [];
            const nextPeriod = localStorage.getItem('nextPeriod');

            $('#currentMood').text(mood);
            $('#selectedSymptoms').empty();
            symptoms.forEach(symptom => {
                $('#selectedSymptoms').append('<span class="badge">' + symptom + '</span>');
            });
            $('#nextPeriod').text(nextPeriod);
        }

        window.addEventListener('storage', updateDashboard);
        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
