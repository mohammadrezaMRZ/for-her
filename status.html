<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وضعیت غزلیلی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .status-card { width: 330px; background: white; border-radius: 28px; padding: 30px; box-shadow: 0 15px 35px rgba(0, 71, 171, 0.1); text-align: center; }
        .header { color: #0047AB; font-size: 20px; margin-bottom: 25px; font-weight: bold; }
        .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f4f8; }
        .label { color: #718096; font-size: 14px; }
        .value { color: #1A202C; font-weight: bold; }
        .badge { background: #f0f7ff; color: #0047AB; padding: 3px 8px; border-radius: 8px; font-size: 11px; margin: 2px; display: inline-block; }
        .cycle { margin-top: 25px; background: #0047AB; padding: 15px; border-radius: 20px; color: white; }
    </style>
</head>
<body>

<div class="status-card">
    <div class="header">خلاصه وضعیت غزلیلی 🌸</div>
    <div class="row"><span class="label">حالت:</span><span class="value" id="m-out">-</span></div>
    <div style="text-align: right; padding: 10px 0;"><span class="label">علائم:</span><div id="s-out"></div></div>
    <div class="cycle"><div>موعد بعدی (تقریبی):</div><strong id="p-out">ثبت نشده</strong></div>
</div>

<script>
    function refresh() {
        document.getElementById('m-out').textContent = localStorage.getItem('savedMood') || 'ثبت نشده';
        document.getElementById('p-out').textContent = localStorage.getItem('savedNextPeriod') || 'نامشخص';
        const syms = JSON.parse(localStorage.getItem('savedSymptoms') || '[]');
        document.getElementById('s-out').innerHTML = syms.length > 0 ? syms.map(s => `<span class="badge">${s}</span>`).join('') : '---';
    }
    
    // اجرای لحظه‌ای و آپدیت خودکار
    refresh();
    setInterval(refresh, 1000); 
</script>
</body>
</html>
